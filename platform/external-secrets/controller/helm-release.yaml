apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  chart:
    spec:
      chart: external-secrets
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      version: 2.6.0
  interval: 30m
  timeout: 10m
  values:
    installCRDs: true
    nodeSelector:
      platform.cyberlynx.io/control-workloads: "true"
    certController:
      nodeSelector:
        platform.cyberlynx.io/control-workloads: "true"
    webhook:
      nodeSelector:
        platform.cyberlynx.io/control-workloads: "true"
