# Example only. Do not commit real secrets.
# Create real secrets using SOPS, SealedSecrets, ExternalSecrets, or manual
# kubectl secret creation outside Git.
apiVersion: v1
kind: Secret
metadata:
  name: drone-server-secret
  namespace: drone
type: Opaque
stringData:
  DRONE_SERVER_HOST: "drone.example.com"
  DRONE_RPC_SECRET: "CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_HEX_32"
  DRONE_DATABASE_DATASOURCE: "postgres://CHANGE_ME_USER:CHANGE_ME_PASSWORD@postgres.drone.svc.cluster.local:5432/CHANGE_ME_DATABASE?sslmode=disable"
  DRONE_USER_CREATE: "username:CHANGE_ME_ADMIN,admin:true"

  # Uncomment and configure ONE provider block only.

  # GitHub OAuth example:
  DRONE_GITHUB_CLIENT_ID: "CHANGE_ME_GITHUB_CLIENT_ID"
  DRONE_GITHUB_CLIENT_SECRET: "CHANGE_ME_GITHUB_CLIENT_SECRET"

  # Gitea OAuth example:
  # DRONE_GITEA_SERVER: "https://gitea.example.com"
  # DRONE_GITEA_CLIENT_ID: "CHANGE_ME_GITEA_CLIENT_ID"
  # DRONE_GITEA_CLIENT_SECRET: "CHANGE_ME_GITEA_CLIENT_SECRET"
