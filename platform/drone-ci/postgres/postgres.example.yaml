# Example only. Do not commit real database credentials.
# Store real database passwords in SOPS, SealedSecrets, ExternalSecrets, or a
# manually created Kubernetes Secret outside public Git.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  labels:
    app: postgres
data:
  POSTGRES_DB: CHANGE_ME_DATABASE
  POSTGRES_USER: CHANGE_ME_USER
  # Prefer moving this value into a Secret for real deployments.
  POSTGRES_PASSWORD: CHANGE_ME_PASSWORD
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: "postgres"
  selector:
    matchLabels:
      app: postgres
  replicas: 1
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          imagePullPolicy: "IfNotPresent"
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-config
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      name: http
      port: 5432
      targetPort: 5432
