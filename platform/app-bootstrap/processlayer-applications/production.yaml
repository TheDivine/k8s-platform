apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: processlayer-prod
  namespace: argocd
  annotations:
    processlayer.ai/registry-prerequisite: processlayer-registry-pull-2026-11-04
spec:
  project: default
  source:
    repoURL: git@github.com:TheDivine/processlayer-ai.git
    targetRevision: main
    path: infra/k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: processlayer-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
