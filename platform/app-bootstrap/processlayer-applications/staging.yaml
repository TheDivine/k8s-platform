apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: processlayer
  namespace: argocd
  annotations:
    processlayer.ai/smtp-prerequisite: df-enquiry-smtp-2026-11-04
spec:
  project: default
  source:
    repoURL: git@github.com:TheDivine/processlayer-ai.git
    targetRevision: main
    path: infra/k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: processlayer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
