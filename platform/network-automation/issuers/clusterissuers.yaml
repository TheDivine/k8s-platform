apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging-cloudflare
spec:
  acme:
    privateKeySecretRef:
      name: letsencrypt-staging-cloudflare-account-key
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              key: api-token
              name: cloudflare-api-token
        selector:
          dnsZones:
            - xn--cyberlnx-ykb.com
            - getuntoldstory.com
            - processlayeri.com
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production-cloudflare
spec:
  acme:
    privateKeySecretRef:
      name: letsencrypt-production-cloudflare-account-key
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              key: api-token
              name: cloudflare-api-token
        selector:
          dnsZones:
            - xn--cyberlnx-ykb.com
            - getuntoldstory.com
            - processlayeri.com
