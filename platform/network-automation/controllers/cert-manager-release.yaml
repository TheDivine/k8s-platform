apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  chart:
    spec:
      chart: cert-manager
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      version: v1.20.2
  interval: 30m
  timeout: 10m
  values:
    crds:
      enabled: true
    nodeSelector:
      platform.cyberlynx.io/control-workloads: "true"
    cainjector:
      nodeSelector:
        platform.cyberlynx.io/control-workloads: "true"
    startupapicheck:
      nodeSelector:
        platform.cyberlynx.io/control-workloads: "true"
    webhook:
      nodeSelector:
        platform.cyberlynx.io/control-workloads: "true"
