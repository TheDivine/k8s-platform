apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kasm
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/kasm/kustomize/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: kasm
  # Suspended until official Kasm manifests or Helm chart details are validated.
  suspend: true

