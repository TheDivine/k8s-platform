apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing-page-service
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: landing-page-service
  template:
    metadata:
      labels:
        app: landing-page-service
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: landing-page-ghcr-read
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: landing-page-demo
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /offer.html
              port: http
          livenessProbe:
            httpGet:
              path: /offer.html
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: landing-page-service
spec:
  selector:
    app: landing-page-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: landing-page-service
spec:
  secretName: landing-page-service-tls
  issuerRef:
    name: letsencrypt-production-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - pages.processlayerai.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: landing-page-service
  annotations:
    external-dns.alpha.kubernetes.io/hostname: pages.processlayerai.com
    external-dns.alpha.kubernetes.io/target: "69.30.233.178"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [pages.processlayerai.com]
      secretName: landing-page-service-tls
  rules:
    - host: pages.processlayerai.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: landing-page-service
                port:
                  name: http
