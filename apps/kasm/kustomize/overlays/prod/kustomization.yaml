apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: traefik.io
      version: v1alpha1
      kind: IngressRoute
      name: kasm
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`kasm.example.com`)

