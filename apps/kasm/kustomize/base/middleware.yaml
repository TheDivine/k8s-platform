apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kasm-secure-headers
  namespace: kasm
  labels:
    app.kubernetes.io/name: kasm
    app.kubernetes.io/component: ingress
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    # Remote desktop and websocket applications may require framing.
    frameDeny: false
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kasm-compress
  namespace: kasm
  labels:
    app.kubernetes.io/name: kasm
    app.kubernetes.io/component: ingress
spec:
  compress: {}

