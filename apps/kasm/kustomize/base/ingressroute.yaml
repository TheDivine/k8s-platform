apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kasm
  namespace: kasm
  labels:
    app.kubernetes.io/name: kasm
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - websecure
  routes:
    # TODO: Change this hostname to the real Kasm domain before enabling Flux.
    # TODO: Validate websocket and remote desktop behavior through Traefik.
    - match: Host(`kasm.example.local`)
      kind: Rule
      middlewares:
        - name: kasm-secure-headers
        - name: kasm-compress
      services:
        # TODO: The kasm-web service must be created by the official Kasm
        # Kubernetes manifests or Helm chart selected for the target version.
        - name: kasm-web
          port: 443
          scheme: https
  # TODO: Replace this placeholder TLS config with the lab certResolver,
  # cert-manager secretName, or other validated TLS strategy.
  tls: {}

