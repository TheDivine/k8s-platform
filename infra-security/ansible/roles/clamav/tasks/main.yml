---
- name: Show ClamAV baseline scope
  ansible.builtin.debug:
    msg:
      - "TODO: install clamav and freshclam packages for the target distro."
      - "TODO: template clamd.conf and freshclam.conf after package paths are confirmed."
      - "Do not scan Kubernetes runtime, containerd, Docker, Longhorn, or pseudo filesystems."

- name: Check clamscan availability
  ansible.builtin.command: clamscan --version
  register: clamscan_version
  changed_when: false
  failed_when: false

- name: Report clamscan version
  ansible.builtin.debug:
    var: clamscan_version.stdout

