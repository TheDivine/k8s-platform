---
- name: Show baseline hardening scope
  ansible.builtin.debug:
    msg:
      - "Documentation-safe scaffold only."
      - "TODO: add distro-specific package, SSH, firewall, sysctl, and update tasks."
      - "Run in check mode before applying to real nodes."

- name: Check SSH service status
  ansible.builtin.command: systemctl is-active ssh
  register: ssh_status
  changed_when: false
  failed_when: false

- name: Report SSH service status
  ansible.builtin.debug:
    var: ssh_status.stdout

