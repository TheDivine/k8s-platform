apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: processlayer-registry-credentials
  namespace: flux-system
spec:
  interval: 10m
  path: ./platform/app-bootstrap/processlayer-registry
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
  healthCheckExprs:
    - apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      failed: status.conditions.exists(c, c.type == 'Synced' && c.status == 'False')
      current: status.conditions.exists(c, c.type == 'Synced' && c.status == 'True')
