apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-automation
  namespace: flux-system
spec:
  interval: 10m
  path: ./platform/network-automation/controllers
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-automation-issuers
  namespace: flux-system
spec:
  dependsOn:
    - name: network-automation
  interval: 10m
  path: ./platform/network-automation/issuers
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  wait: true
