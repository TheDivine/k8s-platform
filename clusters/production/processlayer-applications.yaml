apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: processlayer-applications
  namespace: flux-system
spec:
  dependsOn:
    - name: processlayer-gitops-credentials
  interval: 10m
  path: ./platform/app-bootstrap/processlayer-applications
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
