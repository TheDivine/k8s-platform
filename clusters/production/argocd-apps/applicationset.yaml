apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: production-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/TheDivine/k8s-platform.git
        revision: main
        requeueAfterSeconds: 180
        files:
          - path: clusters/production/app-registry/*.app.yaml
  template:
    metadata:
      name: "{{ .app.name }}"
      namespace: argocd
      labels:
        app.kubernetes.io/managed-by: argocd-applicationset
        platform.cyberlynx.io/environment: production
    spec:
      project: production-apps
      source:
        repoURL: "{{ .app.repoURL }}"
        targetRevision: "{{ .app.revision }}"
        path: "{{ .app.path }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .app.namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
