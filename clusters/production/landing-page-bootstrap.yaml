apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: landing-page-bootstrap
  namespace: flux-system
spec:
  interval: 10m
  path: ./platform/app-bootstrap/landing-page-service
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m
  wait: true
