# Kyverno ClusterPolicy — Require security context hardening by default
# Enforces: seccompProfile (RuntimeDefault), drop ALL capabilities,
#           allowPrivilegeEscalation: false
# Longhorn is namespace-exempt because its storage components require privilege.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-security-context
  annotations:
    policies.kyverno.io/title: Require security context hardening
    policies.kyverno.io/category: Pod Security Standards
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Containers must use RuntimeDefault seccomp, drop ALL capabilities, and
      disallow privilege escalation unless they belong to an explicitly exempt
      platform namespace. Longhorn storage components require privileged host
      access and mount propagation.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-security-context
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - cert-manager
                - flux-system
                - argocd
                - longhorn-system
      validate:
        message: >-
          Security context required: seccompProfile.type=RuntimeDefault,
          capabilities.drop=["ALL"], allowPrivilegeEscalation=false.
        pattern:
          spec:
            securityContext:
              seccompProfile:
                type: RuntimeDefault
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
            =(initContainers):
              - securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
