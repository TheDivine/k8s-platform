# Kyverno ClusterPolicy — Require CPU and memory limits by default
# Enforces: every container must set requests and limits for CPU and memory
# Longhorn is namespace-exempt because it manages dynamic system pods and helpers.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require resource limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Every container must define CPU and memory requests and limits unless it
      belongs to an explicitly exempt platform namespace. Longhorn manages
      dynamic node-level system pods and helper containers.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - cert-manager
                - flux-system
                - argocd
                - kyverno
                - external-dns
                - longhorn-system
      validate:
        message: "CPU and memory requests/limits are required. Add resources.requests and resources.limits."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
            =(initContainers):
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
