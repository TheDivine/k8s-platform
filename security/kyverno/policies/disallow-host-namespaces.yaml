# Detective Zero Trust control based on the Kubernetes Pod Security Standards
# baseline. Host PID/IPC/network namespace sharing crosses the pod isolation
# boundary and should be exceptional.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-namespaces
  annotations:
    policies.kyverno.io/title: Disallow Host Namespaces
    policies.kyverno.io/category: Pod Security Standards
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: host-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - cert-manager
                - flux-system
                - argocd
                - kyverno
                - longhorn-system
      validate:
        message: >-
          Host namespace sharing is not allowed. hostNetwork, hostIPC and hostPID
          must be unset or false.
        pattern:
          spec:
            =(hostPID): false
            =(hostIPC): false
            =(hostNetwork): false
