# Kyverno ClusterPolicy — Block root containers by default
# Enforces: runAsNonRoot must be true, runAsUser must not be 0
# Longhorn is namespace-exempt because its node and storage components require root.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
  annotations:
    policies.kyverno.io/title: Require non-root containers
    policies.kyverno.io/category: Pod Security Standards
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Containers must run as a non-root user unless they belong to an
      explicitly exempt platform namespace. Longhorn node and storage
      components require root and privileged host access.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - cert-manager
                - flux-system
                - argocd
                - kyverno
                - longhorn-system
      validate:
        message: "Running as root is not allowed. Set securityContext.runAsNonRoot=true."
        pattern:
          spec:
            containers:
              - securityContext:
                  runAsNonRoot: true
                  runAsUser: ">0"
            =(ephemeralContainers):
              - securityContext:
                  runAsNonRoot: true
                  runAsUser: ">0"
            =(initContainers):
              - securityContext:
                  runAsNonRoot: true
                  runAsUser: ">0"
