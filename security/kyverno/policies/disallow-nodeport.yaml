# Detective edge-bypass control. NodePort can expose a workload outside the
# intended Traefik/authentication path. Audit first so legacy/test services can
# be identified before this becomes an enforcing policy.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-nodeport
  annotations:
    policies.kyverno.io/title: Disallow NodePort Services
    policies.kyverno.io/category: Zero Trust Network Access
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Service
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: nodeport
      match:
        any:
          - resources:
              kinds:
                - Service
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - metallb-system
      validate:
        message: >-
          NodePort bypasses the intended ingress security boundary. Use ClusterIP
          behind Traefik unless the exposure is explicitly reviewed.
        pattern:
          spec:
            =(type): "!NodePort"
