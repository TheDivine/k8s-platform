# Synthetic boundary fixtures for node-level Longhorn components.
apiVersion: v1
kind: Pod
metadata:
  name: longhorn-manager-policy-fixture
  namespace: longhorn-system
spec:
  containers:
    - name: longhorn-manager
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: longhorn-csi-policy-fixture
  namespace: longhorn-system
spec:
  securityContext:
    runAsUser: 0
  containers:
    - name: longhorn-csi-plugin
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: longhorn-instance-manager-policy-fixture
  namespace: longhorn-system
spec:
  containers:
    - name: instance-manager
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true
