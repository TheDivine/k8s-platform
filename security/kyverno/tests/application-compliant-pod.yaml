# Synthetic positive fixture: a hardened application Pod passes all three rules.
apiVersion: v1
kind: Pod
metadata:
  name: application-compliant-policy-fixture
  namespace: policy-test-application
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: application
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
