apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  chart:
    spec:
      chart: kyverno
      interval: 12h
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
      version: "3.x"
  interval: 30m
  values:
    admissionController:
      replicas: 1
    backgroundController:
      enabled: true
    cleanupController:
      enabled: true
    reportsController:
      enabled: true
